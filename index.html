<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "DM Sans", sans-serif;

      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.10), transparent 30%),
        linear-gradient(135deg, #6f4b8b, #9b73b5, #60427d);
    }

    .slide {
      height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
      position: relative;
    }


    /* sparkles */

    .sparkle {
      position: absolute;
      color: white;
      opacity: 0;
      animation: sparkle 3s infinite ease-in-out;
    }

    .s1 {
      top: 15%;
      left: 15%;
      font-size: 20px;
      animation-delay: 0.5s;
    }

    .s2 {
      top: 25%;
      right: 18%;
      font-size: 14px;
      animation-delay: 1s;
    }

    .s3 {
      bottom: 20%;
      left: 20%;
      font-size: 16px;
      animation-delay: 1.5s;
    }

    .s4 {
      bottom: 15%;
      right: 15%;
      font-size: 22px;
      animation-delay: 2s;
    }


    /* content */

    .content {
      max-width: 700px;
      z-index: 2;
    }


    /* hearts */

    .tag {
      color: rgba(255,255,255,0.75);
      font-size: 14px;
      letter-spacing: 8px;
      margin-bottom: 30px;

      opacity: 0;
      animation: fadeDown 1s ease forwards;
    }


    /* hi baby */

    .greeting {
      color: white;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 12px;

      opacity: 0;
      animation: fadeUp 1s ease forwards;
      animation-delay: 0.5s;
    }


    /* main title */

    h1 {
      font-family: "Playfair Display", serif;
      color: white;

      font-size: clamp(55px, 10vw, 105px);
      line-height: 1;

      text-shadow:
        0 0 10px rgba(255,255,255,0.3),
        0 0 30px rgba(255,255,255,0.15);

      opacity: 0;

      animation: birthdayReveal 1.3s ease forwards;
      animation-delay: 0.8s;

      transition: 0.3s ease;
    }


    h1:hover {
      transform: scale(1.03);

      text-shadow:
        0 0 15px rgba(255,255,255,0.6),
        0 0 40px rgba(255,255,255,0.3);
    }


    /* message */

    .message {
      color: rgba(255,255,255,0.85);
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.8;

      max-width: 500px;
      margin: 30px auto 35px;

      opacity: 0;
      animation: fadeUp 1s ease forwards;
      animation-delay: 1.5s;
    }


    /* button */

    .click-btn {
      background: rgba(255,255,255,0.12);

      border: 1px solid rgba(255,255,255,0.5);

      color: white;

      padding: 15px 40px;
      border-radius: 50px;

      font-family: "DM Sans", sans-serif;
      font-size: 13px;
      letter-spacing: 3px;

      cursor: pointer;

      backdrop-filter: blur(8px);

      transition: 0.3s ease;

      opacity: 0;
      animation: fadeUp 1s ease forwards;
      animation-delay: 2s;
    }


    .click-btn:hover {
      background: white;
      color: #72518c;

      transform: translateY(-4px);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.2);
    }


    /* animations */

    @keyframes fadeDown {

      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    @keyframes fadeUp {

      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    @keyframes birthdayReveal {

      0% {
        opacity: 0;
        transform: scale(0.8);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }

    }


    @keyframes sparkle {

      0%, 100% {
        opacity: 0.2;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
      }

    }

  </style>

</head>


<body>


  <section class="slide">


    <!-- sparkles -->

    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✧</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✧</div>


    <div class="content">


      <!-- hearts -->

      <p class="tag">♡ ♡ ♡</p>


      <!-- greeting -->

      <p class="greeting">hi baby!</p>


      <!-- title -->

      <h1>HAPPY BIRTHDAY!</h1>


      <!-- message -->

      <p class="message">

        i honestly didn't know what to give you,
        so i made this instead.
        <br><br>
        i know it's just a small thing,
        but i hope you'll still appreciate it :>

      </p>


      <!-- button -->

      <button class="click-btn" onclick="nextSlide()">
        CLICK →
      </button>


    </div>


  </section>
  
<!-- SLIDE 2 -->

<section class="slide slide2" id="slide2">

  <div class="sparkle s1">✦</div>
  <div class="sparkle s2">✧</div>
  <div class="sparkle s3">✦</div>

  <div class="envelope-container">

    <p class="instruction">
      tap the envelope ♡
    </p>

    <div class="envelope" onclick="openEnvelope()">

      <div class="flap"></div>

      <div class="left-fold"></div>

      <div class="right-fold"></div>

      <div class="bottom-fold"></div>

      <div class="heart">♡</div>

    </div>

  </div>

</section>
 
  <script>

    function nextSlide() {

      alert("the next surprise is waiting ♡");

    }

  </script>


</body>
</html>

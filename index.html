<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday ♡</title>

  <!-- Clean minimalist fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "DM Sans", sans-serif;

      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.18), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.12), transparent 30%),
        linear-gradient(135deg, #6f4b8b, #9b73b5, #60427d);
    }

    .slide {
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
      position: relative;
    }


    /* Sparkles */

    .sparkle {
      position: absolute;
      color: white;
      opacity: 0;
      animation: sparkle 3s infinite ease-in-out;
    }

    .s1 {
      top: 15%;
      left: 15%;
      font-size: 20px;
      animation-delay: 0.5s;
    }

    .s2 {
      top: 25%;
      right: 18%;
      font-size: 14px;
      animation-delay: 1s;
    }

    .s3 {
      bottom: 20%;
      left: 20%;
      font-size: 16px;
      animation-delay: 1.5s;
    }

    .s4 {
      bottom: 15%;
      right: 15%;
      font-size: 22px;
      animation-delay: 2s;
    }


    /* Main content */

    .content {
      max-width: 750px;
      z-index: 2;
    }


    /* Top text */

    .tag {
      color: rgba(255,255,255,0.75);
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 30px;

      opacity: 0;
      animation: fadeDown 1s ease forwards;
    }


    /* Hi baby */

    .greeting {
      color: white;
      font-size: clamp(25px, 4vw, 38px);
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 10px;

      opacity: 0;
      animation: fadeUp 1s ease forwards;
      animation-delay: 0.5s;
    }


    /* Happy Birthday */

    h1 {
      font-family: "Playfair Display", serif;
      color: white;

      font-size: clamp(55px, 10vw, 110px);
      line-height: 0.95;

      text-shadow:
        0 0 10px rgba(255,255,255,0.3),
        0 0 30px rgba(255,255,255,0.15);

      cursor: default;

      opacity: 0;
      animation: birthdayReveal 1.3s ease forwards;
      animation-delay: 0.8s;

      transition: 0.3s ease;
    }


    /* Interactive birthday hover */

    h1:hover {
      transform: scale(1.03);
      text-shadow:
        0 0 15px rgba(255,255,255,0.6),
        0 0 40px rgba(255,255,255,0.3);
    }


    /* Message */

    .message {
      color: rgba(255,255,255,0.8);
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.7;

      max-width: 500px;
      margin: 28px auto 35px;

      opacity: 0;
      animation: fadeUp 1s ease forwards;
      animation-delay: 1.5s;
    }


    /* Button */

    .click-btn {

      background: rgba(255,255,255,0.12);

      border: 1px solid rgba(255,255,255,0.5);

      color: white;

      padding: 15px 38px;

      border-radius: 50px;

      font-family: "DM Sans", sans-serif;
      font-size: 13px;
      letter-spacing: 2px;

      cursor: pointer;

      backdrop-filter: blur(8px);

      transition: 0.3s ease;

      opacity: 0;
      animation: fadeUp 1s ease forwards;
      animation-delay: 2s;
    }


    .click-btn:hover {

      background: white;
      color: #72518c;

      transform: translateY(-4px);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.2);
    }


    /* Animations */

    @keyframes fadeDown {

      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    @keyframes fadeUp {

      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    @keyframes birthdayReveal {

      0% {
        opacity: 0;
        transform: scale(0.8);
        letter-spacing: -5px;
      }

      100% {
        opacity: 1;
        transform: scale(1);
        letter-spacing: 0;
      }

    }


    @keyframes sparkle {

      0%, 100% {
        opacity: 0.2;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
      }

    }

  </style>

</head>


<body>


  <section class="slide">


    <!-- Sparkles -->

    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✧</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✧</div>


    <div class="content">


      <!-- Top text -->

      <p class="tag">
        for the birthday boy ♡
      </p>


      <!-- Greeting -->

      <p class="greeting">
        hi baby!
      </p>


      <!-- Main title -->

      <h1>
        HAPPY BIRTHDAY!
      </h1>


      <!-- Message -->

      <p class="message">

        today is all about you.
        <br>
        so sit back, click around,
        <br>
        and let me make your day
        <br>
        a little more special ♡

      </p>


      <!-- Button -->

      <button class="click-btn" onclick="nextSlide()">

        CLICK TO BEGIN →

      </button>


    </div>

  </section>



  <script>

    function nextSlide() {

      alert("next surprise coming soon ♡");

    }

  </script>


</body>
</html>
